<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Decision Tree | informatik-nds</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #1e1e1e; /* Einheitliches Dark Grey */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
    }

    /* Das Canvas Element */
    canvas {
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
      border-radius: 4px;
    }

    /* Der Zurück-Button */
    .home-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      text-decoration: none;
      padding: 8px 15px;
      border-radius: 5px;
      font-size: 14px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.2s;
      z-index: 1000;
      backdrop-filter: blur(5px);
    }

    .home-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

<a href="index.html" class="home-btn">⬅ Übersicht</a>

<script>
/**
 * Decision Tree Simulator - Complete Code
 * Angepasst für informatik-nds.de
 */

// --- KONFIGURATION ---
const VIS_MAX_DEPTH = 6;

// --- GUI Elemente ---
let depthSlider, classSlider, spreadSlider;
let patternStepper; 

// --- Daten ---
let trainingData = [];
let maxDepth = 6; 
let currentClasses = 2;
let currentSpread = 1.5; 

// --- Entscheidungsbaum ---
let rootNode = null;

// --- Layout Variablen ---
let simWidth = 920;   
let treeWidth;          
let gridSize = 20;      
let margin = 55;       
let scaleFactor;      

// --- Heatmap ---
let showHeatmap = false; 

// --- Party-Modus ---
let partyMode = false;
let keyBuffer = "";        
let fireworks = [];
let gravity;

// --- Farben ---
let classColors = [];

function setup() {
  createCanvas(1920, 1080);
  
  // Farben initialisieren
  classColors = [
    color(100, 150, 230), // Blau 
    color(100, 200, 120), // Grün 
    color(255, 100, 100), // Rot
    color(255, 200, 80),  // Gelb
    color(160, 50, 200),  // Lila
    color(0, 200, 200)    // Türkis
  ];

  gravity = createVector(0, 0.2);

  treeWidth = width - simWidth;
  scaleFactor = (simWidth - 2 * margin) / gridSize;
  
  // --- UI Layout Berechnung ---
  let sliderW = 180; 
  let gap = 20;
  let sliderY = 70; 
  let startX = margin;
  
  depthSlider = new CustomSlider(startX, sliderY, sliderW, 20, 1, 15, 6, true, "Max. Baumtiefe");
  
  startX += sliderW + gap;
  classSlider = new CustomSlider(startX, sliderY, sliderW, 20, 2, 5, 2, true, "Anzahl Klassen");
  
  startX += sliderW + gap;
  spreadSlider = new CustomSlider(startX, sliderY, sliderW, 20, 0.5, 3.0, 1.5, false, "Streuung (Fläche)");
  
  startX += sliderW + gap;
  patternStepper = new Stepper(startX, sliderY, 190, 20, "Verteilung (Klick)", ["Linear (Streifen)", "Ring (Kreis)", "Cluster (Gitter)"]);
  
  generateData(); 
}

function draw() {
  // Hintergrund anpassen: Dark im PartyMode, helles Grau sonst (angenehmer als hartes Weiß)
  if (partyMode) background(30); else background(245);
  
  // --- 1. UI Updates (Slider) ---
  let depthChanged = depthSlider.update();
  let classChanged = classSlider.update();
  let spreadChanged = spreadSlider.update();
  
  if (depthChanged) {
    maxDepth = depthSlider.value;
    buildDecisionTree();
  }
  
  if (classChanged || spreadChanged) {
    currentClasses = classSlider.value;
    currentSpread = spreadSlider.value;
    generateData(); 
  }
  
  // --- 2. GUI Zeichnen ---
  depthSlider.display();
  classSlider.display();
  spreadSlider.display();
  patternStepper.display();
  
  // --- 3. LINKER BEREICH (GRID) ---
  
  let gridPixelHeight = gridSize * scaleFactor;
  let gridTopY = height - margin - gridPixelHeight; 
  let gridLeftX = margin;
  
  let isInside = (mouseX >= gridLeftX && mouseX <= gridLeftX + gridPixelHeight && 
                  mouseY >= gridTopY && mouseY <= height - margin);
  
  // Clipping simulieren
  push();
  drawingContext.beginPath();
  drawingContext.rect(gridLeftX, gridTopY, gridPixelHeight, gridPixelHeight);
  drawingContext.clip();

  translate(margin, height - margin); 
  scale(1, -1); 
  
  if (showHeatmap && rootNode != null) {
    noStroke();
    drawTreeRegions(rootNode, 0, gridSize, 0, gridSize);
  }
  
  drawGridLinesOnly();
  
  if (rootNode != null) {
    stroke(0); strokeWeight(2); 
    drawTreeBoundaries(rootNode, 0, gridSize, 0, gridSize);
  }
  
  drawTrainingData();
  
  if (isInside) {
    let mouseXGraph = (mouseX - margin) / scaleFactor;
    let mouseYGraph = (height - margin - mouseY) / scaleFactor;
    let predicted = predictClass(rootNode, mouseXGraph, mouseYGraph);
    drawPredictionVisuals(mouseXGraph, mouseYGraph, predicted);
  }
  
  pop(); 
  
  // Rahmen um das Grid
  noFill(); stroke(0); strokeWeight(1);
  rect(gridLeftX, gridTopY, gridPixelHeight, gridPixelHeight);
  
  // Trennlinie zwischen Grid und Baum
  stroke(180); strokeWeight(2);
  line(simWidth, 0, simWidth, height);
  
  // --- 4. RECHTER BEREICH: BAUM ---
  drawTreeVisualization();
  
  drawUI(); 
  
  if (partyMode) runFireworks();
}

function mousePressed() {
  // Check Click auf den Pattern Stepper
  if (patternStepper.checkClick(mouseX, mouseY)) {
    generateData(); // Sofort neue Daten erzeugen
  }
}

// --- BAUM VISUALISIERUNG ---

function drawTreeVisualization() {
  // Hintergrund für den Baumbereich löschen (damit er sauber aussieht)
  if (!partyMode) {
    noStroke(); fill(245); // Gleiches Grau wie Hintergrund
    rect(simWidth, 0, treeWidth, height);
  }
  
  fill(partyMode ? 255 : 0);
  textFont('Segoe UI'); textStyle(NORMAL); textSize(24);
  textAlign(CENTER, TOP);
  text("Entscheidungsbaum Struktur", simWidth + treeWidth/2, 40);
  
  textSize(14); fill(100);
  if(maxDepth > VIS_MAX_DEPTH) {
    text("(Limitierte Anzeige: Tiefe " + VIS_MAX_DEPTH + ". Logik läuft tiefer.)", simWidth + treeWidth/2, 70);
  } else {
    text("(Vollständiger Baum)", simWidth + treeWidth/2, 70);
  }
  
  if (rootNode != null) {
    let initialHGap = treeWidth * 0.24; 
    drawTreeNode(rootNode, simWidth + treeWidth/2, 120, initialHGap, 110, 0);
  }
}

function drawTreeNode(node, x, y, hGap, vGap, depth) {
  if (node == null) return;
  
  if (depth == VIS_MAX_DEPTH) {
    drawNodeBody(node, x, y, true); 
    if (!node.isLeaf) {
      stroke(partyMode ? 200 : 100); strokeWeight(1);
      line(x, y + 20, x, y + 35);
      fill(partyMode ? 255 : 50); textAlign(CENTER, TOP); noStroke();
      textStyle(BOLD); textSize(14);
      text("...", x, y + 38);
      textStyle(NORMAL); textSize(10);
      text("versteckt", x, y + 52);
    }
    return;
  }
  
  stroke(partyMode ? 150 : 80); strokeWeight(1.5);
  
  if (!node.isLeaf) {
    if (node.left != null) line(x, y, x - hGap, y + vGap);
    if (node.right != null) line(x, y, x + hGap, y + vGap);
  }
  
  drawNodeBody(node, x, y, node.isLeaf);
  
  if (!node.isLeaf) {
    textStyle(NORMAL); textSize(11);
    fill(partyMode ? 200 : 80); 
    if(node.left != null) {
      noStroke(); fill(partyMode ? 30 : 245); 
      rectMode(CENTER); rect(x - hGap/2, y + vGap/2, 18, 12); rectMode(CORNER);
      fill(partyMode ? 255 : 0); text("Ja", x - hGap/2, y + vGap/2 + 4); 
    }
    if(node.right != null) {
      noStroke(); fill(partyMode ? 30 : 245);
      rectMode(CENTER); rect(x + hGap/2, y + vGap/2, 22, 12); rectMode(CORNER);
      fill(partyMode ? 255 : 0); text("Nein", x + hGap/2, y + vGap/2 + 4);
    }
    drawTreeNode(node.left, x - hGap, y + vGap, hGap * 0.5, vGap, depth + 1);
    drawTreeNode(node.right, x + hGap, y + vGap, hGap * 0.5, vGap, depth + 1);
  }
}

function drawNodeBody(node, x, y, visualLeaf) {
  stroke(0); strokeWeight(1.2);
  textStyle(NORMAL); textSize(13);
  
  if (visualLeaf) {
    if (node.isLeaf) {
      fill(classColors[node.predictedClass]);
      rectMode(CENTER); rect(x, y, 46, 26, 6); rectMode(CORNER);
      fill(255); textAlign(CENTER, CENTER); noStroke();
      text("K " + (node.predictedClass + 1), x, y + 1);
    } else {
      fill(255); ellipse(x, y, 80, 32);
      fill(0); textAlign(CENTER, CENTER); noStroke();
      let axis = (node.featureIndex == 0) ? "X" : "Y";
      text(axis + " < " + nf(node.threshold, 1, 1), x, y + 1);
    }
  } else {
    fill(255); ellipse(x, y, 80, 32);
    fill(0); textAlign(CENTER, CENTER); noStroke();
    let axis = (node.featureIndex == 0) ? "X" : "Y";
    text(axis + " < " + nf(node.threshold, 1, 1), x, y + 1);
  }
}

// --- ZEICHNEN SIMULATION ---

function drawTreeRegions(node, minX, maxX, minY, maxY) {
  if (node.isLeaf) {
    let c = classColors[node.predictedClass];
    fill(red(c), green(c), blue(c), 100); 
    rect(minX * scaleFactor, minY * scaleFactor, (maxX - minX) * scaleFactor, (maxY - minY) * scaleFactor);
    return;
  }
  if (node.featureIndex == 0) { 
    drawTreeRegions(node.left, minX, node.threshold, minY, maxY);
    drawTreeRegions(node.right, node.threshold, maxX, minY, maxY);
  } else { 
    drawTreeRegions(node.left, minX, maxX, minY, node.threshold);
    drawTreeRegions(node.right, minX, maxX, node.threshold, maxY);
  }
}

function drawTreeBoundaries(node, minX, maxX, minY, maxY) {
  if (node.isLeaf) return;
  if (node.featureIndex == 0) { 
    let xPos = node.threshold * scaleFactor;
    line(xPos, minY * scaleFactor, xPos, maxY * scaleFactor);
    drawTreeBoundaries(node.left, minX, node.threshold, minY, maxY);
    drawTreeBoundaries(node.right, node.threshold, maxX, minY, maxY);
  } else { 
    let yPos = node.threshold * scaleFactor;
    line(minX * scaleFactor, yPos, maxX * scaleFactor, yPos);
    drawTreeBoundaries(node.left, minX, maxX, minY, node.threshold);
    drawTreeBoundaries(node.right, minX, maxX, node.threshold, maxY);
  }
}

function drawPredictionVisuals(x, y, predictedClass) {
  stroke(0); strokeWeight(2);
  if(predictedClass >= 0 && predictedClass < classColors.length) fill(classColors[predictedClass]); 
  else fill(200); 
  ellipse(x * scaleFactor, y * scaleFactor, 22, 22);
  fill(255); textStyle(NORMAL); textSize(12); textAlign(CENTER, CENTER); noStroke();
  
  push(); 
  translate(x * scaleFactor, y * scaleFactor); 
  scale(1, -1); 
  text("?", 0, 1); 
  pop();
}

function drawTrainingData() {
  noStroke();
  for (let p of trainingData) {
    if(showHeatmap) stroke(0); else noStroke();
    strokeWeight(1);
    fill(classColors[p.classId]); 
    ellipse(p.pos.x * scaleFactor, p.pos.y * scaleFactor, 12, 12);
  }
}

function drawGridLinesOnly() {
  strokeWeight(1); stroke(200); 
  for (let i = 0; i <= gridSize; i++) {
    let pos = i * scaleFactor;
    line(pos, 0, pos, gridSize * scaleFactor);
    line(0, pos, gridSize * scaleFactor, pos);
  }
}

// --- UI & Text ---

function drawUI() {
  if (partyMode) fill(255); else fill(0);
  
  textAlign(LEFT, BASELINE);
  textStyle(NORMAL); textSize(28); noStroke();
  text("Interaktiver Decision Tree", margin, 45);
  
  // Legende
  let legendX = margin;
  let legendY = 130;
  
  textAlign(LEFT, TOP);
  textSize(16);
  
  if (partyMode) fill(200); else fill(80);
  
  let status = "Max Tiefe: " + depthSlider.value + " | Klassen: " + classSlider.value;
  if(partyMode) status += " *** PARTY MODE ***";
  text(status, legendX, legendY);
  
  if (partyMode) fill(255); else fill(0);
  text("Steuerung: [R] Neue Daten | [F] Heatmap an/aus | Maus bewegen zum Testen", legendX, legendY + 25);
}

// --- DECISION TREE LOGIK ---

class Node {
  constructor(arg1, arg2, arg3, arg4) {
    if (arguments.length === 1) {
       this.isLeaf = true; this.predictedClass = arg1;
    } else {
       this.isLeaf = false; this.featureIndex = arg1; this.threshold = arg2;
       this.left = arg3; this.right = arg4;
    }
  }
}

function buildDecisionTree() { rootNode = splitNode(trainingData, 0); }

function splitNode(data, depth) {
  if (data.length === 0) return new Node(0);
  if (isPure(data)) return new Node(data[0].classId);
  if (depth >= maxDepth) return new Node(getMajorityClass(data));
  
  let bestSplit = getBestSplit(data);
  if (bestSplit.gini === -1) return new Node(getMajorityClass(data));
  
  let leftChild = splitNode(bestSplit.leftData, depth + 1);
  let rightChild = splitNode(bestSplit.rightData, depth + 1);
  return new Node(bestSplit.featureIndex, bestSplit.threshold, leftChild, rightChild);
}

class Split {
  constructor(f, t, g, l, r) {
    this.featureIndex = f; this.threshold = t; this.gini = g; this.leftData = l; this.rightData = r;
  }
}

function getBestSplit(data) {
  let bestGini = 1.0; let bestFeature = -1; let bestThreshold = 0;
  let bestLeft = null; let bestRight = null;
  
  for (let feat = 0; feat < 2; feat++) {
    data.sort((a, b) => {
       let valA = (feat === 0) ? a.pos.x : a.pos.y;
       let valB = (feat === 0) ? b.pos.x : b.pos.y;
       return valA - valB;
    });
    
    for (let i = 0; i < data.length - 1; i++) {
      let p1 = data[i]; let p2 = data[i+1];
      let val1 = (feat === 0) ? p1.pos.x : p1.pos.y;
      let val2 = (feat === 0) ? p2.pos.x : p2.pos.y;
      if (val1 === val2) continue;
      let threshold = (val1 + val2) / 2.0;
      
      let left = []; let right = [];
      for(let p of data) {
        let val = (feat === 0) ? p.pos.x : p.pos.y;
        if (val < threshold) left.push(p); else right.push(p);
      }
      
      let giniLeft = calculateGini(left); let giniRight = calculateGini(right);
      let weightedGini = (left.length * giniLeft + right.length * giniRight) / data.length;
      if (weightedGini < bestGini) {
        bestGini = weightedGini; bestFeature = feat; bestThreshold = threshold;
        bestLeft = left; bestRight = right;
      }
    }
  }
  if (bestFeature === -1) return new Split(0,0,-1, null, null);
  return new Split(bestFeature, bestThreshold, bestGini, bestLeft, bestRight);
}

function calculateGini(subset) {
  if (subset.length === 0) return 0;
  let counts = new Array(currentClasses).fill(0);
  for (let p of subset) if (p.classId < currentClasses) counts[p.classId]++;
  let impurity = 1.0;
  for (let c of counts) { let prob = c / subset.length; impurity -= (prob * prob); }
  return impurity;
}

function isPure(data) {
  let firstClass = data[0].classId;
  for (let p of data) if (p.classId !== firstClass) return false;
  return true;
}

function getMajorityClass(data) {
  let counts = new Array(currentClasses).fill(0);
  for (let p of data) if (p.classId < currentClasses) counts[p.classId]++;
  let maxIndex = -1; let maxCount = -1;
  for (let i=0; i<currentClasses; i++) { if (counts[i] > maxCount) { maxCount = counts[i]; maxIndex = i; } }
  return maxIndex;
}

function predictClass(node, x, y) {
  if (node.isLeaf) return node.predictedClass;
  let val = (node.featureIndex === 0) ? x : y;
  if (val < node.threshold) return predictClass(node.left, x, y);
  else return predictClass(node.right, x, y);
}

// --- DATEN (MANUELL WÄHLBAR) ---

class DataPoint {
  constructor(x, y, c) { this.pos = createVector(x, y); this.classId = c; }
}

function generateData() {
  trainingData = [];
  
  // Layout Typ holen (0: Linear, 1: Kreis, 2: Cluster)
  let layoutType = patternStepper.index;

  let centers = [];
  
  // 1. Zentren bestimmen
  if (layoutType === 0) {
     // LINEAR (Schräg)
     let angle = random(TWO_PI);
     let dist = 14; 
     let dir = p5.Vector.fromAngle(angle);
     for(let i=0; i<currentClasses; i++) {
         let t = map(i, 0, currentClasses-1, -0.5, 0.5);
         let pos = createVector(10, 10).add(p5.Vector.mult(dir, t * dist));
         centers.push(pos);
     }
  } 
  else if (layoutType === 1) {
     // KREIS
     let radius = 7.0; 
     let startAngle = random(TWO_PI);
     for(let i=0; i<currentClasses; i++) {
         let angle = startAngle + map(i, 0, currentClasses, 0, TWO_PI);
         let cx = 10 + cos(angle) * radius;
         let cy = 10 + sin(angle) * radius;
         centers.push(createVector(cx, cy));
     }
  } 
  else {
     // CLUSTER (GRID/Ecken)
     let cols = ceil(sqrt(currentClasses));
     let rows = ceil(currentClasses / cols);
     let cellW = 18 / cols; 
     let cellH = 18 / rows;
     
     for(let i=0; i<currentClasses; i++) {
        let col = i % cols;
        let row = floor(i / cols);
        let cx = 1 + (col + 0.5) * cellW;
        let cy = 1 + (row + 0.5) * cellH;
        cx += random(-0.5, 0.5);
        cy += random(-0.5, 0.5);
        centers.push(createVector(cx, cy));
     }
  }
  
  // 2. Punkte generieren
  for (let i = 0; i < currentClasses; i++) {
    let center = centers[i];
    let count = 50; 
    
    // Individuelle "Form"
    let cloudAngle = random(TWO_PI);
    let elongation = random(1.0, 2.0); 
    
    for (let j = 0; j < count; j++) {
      let x = 0, y = 0;
      let valid = false;
      let attempts = 0;
      while(!valid && attempts < 100) {
         // Streuung (1.2 für kompakte Cluster)
         let s = currentSpread * 1.2; 
         
         let u = randomGaussian(0, s);            
         let v = randomGaussian(0, s * elongation); 
         
         let rx = u * cos(cloudAngle) - v * sin(cloudAngle);
         let ry = u * sin(cloudAngle) + v * cos(cloudAngle);
         
         x = center.x + rx;
         y = center.y + ry;
         
         if (x > 0.5 && x < 19.5 && y > 0.5 && y < 19.5) valid = true;
         attempts++;
      }
      if (!valid) { x = constrain(x, 0.5, 19.5); y = constrain(y, 0.5, 19.5); }
      trainingData.push(new DataPoint(x, y, i));
    }
  }
  
  buildDecisionTree();
}

// --- PARTY ---

function runFireworks() {
  for (let i = fireworks.length - 1; i >= 0; i--) {
    let f = fireworks[i]; f.run();
    if (f.done()) fireworks.splice(i, 1);
  }
}

class Particle {
  constructor(x, y, col, seed) {
    this.pos = createVector(x, y); this.c = col; this.isSeed = seed; this.lifespan = 255.0;
    if (this.isSeed) { this.vel = createVector(0, random(-14, -10)); this.acc = createVector(0, 0); } 
    else { this.vel = p5.Vector.random2D(); this.vel.mult(random(2, 8)); this.acc = createVector(0, 0); }
  }
  applyForce(force) { this.acc.add(force); }
  update() { if (!this.isSeed) { this.vel.mult(0.95); this.lifespan -= 4.0; } this.vel.add(this.acc); this.pos.add(this.vel); this.acc.mult(0); }
  display() {
    if (this.isSeed) { strokeWeight(4); stroke(this.c); point(this.pos.x, this.pos.y); } 
    else { noStroke(); fill(red(this.c), green(this.c), blue(this.c), this.lifespan); ellipse(this.pos.x, this.pos.y, 4, 4); }
  }
  isDead() { return (this.lifespan < 0.0); }
}

class Firework {
  constructor() { 
    this.col = color(random(50, 255), random(50, 255), random(50, 255)); 
    this.seed = new Particle(random(width), height, this.col, true); 
    this.particles = []; 
    this.exploded = false;
  }
  done() { return (this.exploded && this.particles.length === 0); }
  run() {
    if (!this.exploded) { 
        this.seed.applyForce(gravity); this.seed.update(); this.seed.display(); 
        if (this.seed.vel.y >= 0) { this.exploded = true; this.explode(); } 
    }
    for (let i = this.particles.length - 1; i >= 0; i--) {
      let p = this.particles[i]; p.applyForce(gravity); p.update(); p.display(); if (p.isDead()) this.particles.splice(i, 1);
    }
  }
  explode() { for (let i = 0; i < 100; i++) this.particles.push(new Particle(this.seed.pos.x, this.seed.pos.y, this.col, false)); }
}

// --- INPUT ---

function keyPressed() {
  if (key.length === 1) {
    keyBuffer += key.toLowerCase();
    if (keyBuffer.length > 5) keyBuffer = keyBuffer.substring(keyBuffer.length - 5);
    if (keyBuffer === "party") partyMode = !partyMode;
    
    if (key === 'r' || key === 'R') { 
      generateData(); 
      showHeatmap = false; 
    } 
    else if (key === 'f' || key === 'F') { showHeatmap = !showHeatmap; }
  }
}

// --- GUI HELPER CLASSES ---

class CustomSlider {
  constructor(x, y, w, h, min, max, startVal, isInt, label) {
    this.x = x; this.y = y; this.w = w; this.h = h; 
    this.min = min; this.max = max; this.value = startVal; 
    this.isInt = isInt; this.label = label;
    this.dragging = false;
  }
  
  update() {
    let changed = false;
    if (mouseIsPressed && mouseX >= this.x && mouseX <= this.x + this.w && mouseY >= this.y && mouseY <= this.y + this.h) {
        this.dragging = true;
    }
    if (!mouseIsPressed) this.dragging = false;
    
    if (this.dragging) {
      let oldVal = this.value;
      let val = map(mouseX, this.x, this.x + this.w, this.min, this.max);
      val = constrain(val, this.min, this.max);
      this.value = val;
      if (this.isInt) { 
          this.value = Math.round(val); 
          if (this.value !== Math.round(oldVal)) changed = true; 
      } else { 
          if (Math.abs(this.value - oldVal) > 0.01) changed = true; 
      }
    }
    return changed;
  }
  
  display() {
    stroke(0); fill(240); rect(this.x, this.y, this.w, this.h);
    let pos = map(this.value, this.min, this.max, this.x, this.x + this.w);
    fill(100, 150, 255); rect(this.x, this.y, pos - this.x, this.h);
    fill(255); stroke(0); rect(pos - 5, this.y - 2, 10, this.h + 4);
    
    noStroke(); fill(0); textAlign(LEFT, BOTTOM); textSize(14);
    text(this.label, this.x, this.y - 5);
    textAlign(RIGHT, BOTTOM);
    let valStr = this.isInt ? this.value.toString() : nf(this.value, 1, 1);
    text(valStr, this.x + this.w, this.y - 5);
  }
}

// --- NEUE KLASSE: STEPPER BUTTON ---
class Stepper {
  constructor(x, y, w, h, label, options) {
    this.x = x; this.y = y; this.w = w; this.h = h;
    this.label = label;
    this.options = options;
    this.index = 2; // Start mit Cluster (Gitter)
  }
  
  checkClick(mx, my) {
    if (mx >= this.x && mx <= this.x + this.w && my >= this.y && my <= this.y + this.h) {
      this.index = (this.index + 1) % this.options.length;
      return true;
    }
    return false;
  }
  
  display() {
    // Hintergrund Box
    stroke(0); fill(220);
    rect(this.x, this.y, this.w, this.h);
    
    // Label oben
    noStroke(); fill(0); textAlign(LEFT, BOTTOM); textSize(14);
    text(this.label, this.x, this.y - 5);
    
    // Text in der Box
    fill(0); textAlign(CENTER, CENTER); textSize(13);
    text(this.options[this.index], this.x + this.w/2, this.y + this.h/2);
  }
}
