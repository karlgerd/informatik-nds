<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Neuronale Netze mit Open Roberta</title>
    <style>
        :root {
            --primary-color: #008a8b; /* Roberta Teal */
            --secondary-color: #f29400; /* Roberta Orange */
            --bg-color: #f4f7f6;
            --text-color: #333;
            --card-bg: #ffffff;
            --success-color: #28a745;
            --error-color: #dc3545;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .quiz-container {
            max-width: 800px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        header {
            text-align: center;
            border-bottom: 3px solid var(--primary-color);
            margin-bottom: 20px;
            padding-bottom: 10px;
        }

        h1 { color: var(--primary-color); margin-bottom: 5px; }
        .difficulty { font-weight: bold; color: var(--secondary-color); font-size: 0.9em; }

        .question-block {
            margin-bottom: 25px;
            padding: 15px;
            border-left: 5px solid var(--primary-color);
            background: #fafafa;
            display: none; /* Hidden by default for step-by-step */
        }

        .question-block.active { display: block; }

        .options-list {
            list-style: none;
            padding: 0;
            margin-top: 15px;
        }

        .option-item {
            background: #fff;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
        }

        .option-item:hover {
            border-color: var(--primary-color);
            background-color: #f0f9f9;
        }

        .option-item.selected {
            border-color: var(--secondary-color);
            background-color: #fff9f0;
        }

        .checkbox {
            width: 20px;
            height: 20px;
            margin-right: 15px;
            border: 2px solid #ccc;
            border-radius: 4px;
            display: inline-block;
        }

        .selected .checkbox {
            background-color: var(--secondary-color);
            border-color: var(--secondary-color);
            position: relative;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        .btn-next { background-color: var(--primary-color); color: white; }
        .btn-submit { background-color: var(--success-color); color: white; display: none; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        #result-area {
            text-align: center;
            display: none;
        }

        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 10px solid var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5em;
            font-weight: bold;
            margin: 20px auto;
            color: var(--primary-color);
        }

        .progress-bar {
            height: 10px;
            background: #ddd;
            border-radius: 5px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary-color);
            width: 0%;
            transition: width 0.3s;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <header>
        <h1>Roboter-KI Quiz</h1>
        <p>Themenkomplex: Neuronale Netze mit Open Roberta</p>
    </header>

    <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

    <div id="quiz-box">
        </div>

    <div class="controls">
        <span id="question-counter">Frage 1 von 15</span>
        <button class="btn-next" id="next-btn" onclick="nextQuestion()">Nächste Frage</button>
        <button class="btn-submit" id="submit-btn" onclick="showResults()">Ergebnis anzeigen</button>
    </div>

    <div id="result-area">
        <h2>Dein Ergebnis</h2>
        <div class="score-circle" id="score-display">0/15</div>
        <p id="feedback-text"></p>
        <button class="btn-next" onclick="location.reload()">Quiz neu starten</button>
    </div>
</div>

<script>
    const questions = [
        {
            q: "Welchen Zweck erfüllt das Perzeptron im beschriebenen Roboterszenario?",
            diff: "*",
            options: [
                { text: "Es berechnet aus Ist- und Soll-Abstand die Motorleistung.", correct: true },
                { text: "Es dient als mathematisches Modell zur Entscheidungsfindung.", correct: true },
                { text: "Es erkennt Hindernisse mithilfe einer Kamera.", correct: false },
                { text: "Es speichert die gefahrene Gesamtstrecke.", correct: false }
            ]
        },
        {
            q: "Was passiert beim 'Training' eines neuronalen Netzes im Kern?",
            diff: "*",
            options: [
                { text: "Gewichte und Bias werden schrittweise angepasst.", correct: true },
                { text: "Die Verbindungsgewichte werden optimiert.", correct: true },
                { text: "Der Programmcode wird automatisch umgeschrieben.", correct: false },
                { text: "Die Sensoren werden physisch neu kalibriert.", correct: false }
            ]
        },
        {
            q: "In der Formel y = w₁·x₁ + w₂·x₂ + b: Was bewirkt ein negatives Gewicht w₁?",
            diff: "**",
            options: [
                { text: "Je größer die Eingabe x₁, desto kleiner/negativer die Ausgabe.", correct: true },
                { text: "Der Einfluss der Eingabe wird invertiert.", correct: true },
                { text: "Die Motorleistung wird zwingend immer negativ.", correct: false },
                { text: "Der Roboter fährt bei Hindernissen immer schneller.", correct: false }
            ]
        },
        {
            q: "Warum ist die Wahl der 'Lernrate' (η) entscheidend?",
            diff: "**",
            options: [
                { text: "Zu hohe Werte können das Optimum überspringen.", correct: true },
                { text: "Zu niedrige Werte erfordern sehr viele Epochen.", correct: true },
                { text: "Sie bestimmt die Endgeschwindigkeit des Roboters.", correct: false },
                { text: "Sie legt die Anzahl der Neuronen fest.", correct: false }
            ]
        },
        {
            q: "Was beschreibt der Begriff 'Epoche' im Training?",
            diff: "**",
            options: [
                { text: "Ein kompletter Durchlauf durch alle Trainingsdatensätze.", correct: true },
                { text: "Die Häufigkeit der Wiederholung des gesamten Datensatzes.", correct: true },
                { text: "Die Zeitdauer einer Testfahrt in Sekunden.", correct: false },
                { text: "Die Anzahl der Schichten im neuronalen Netz.", correct: false }
            ]
        },
        {
            q: "Wie lautet die Zielvorgabe für die Motorleistung bei exakt 20 cm Abstand (Soll = 20)?",
            diff: "***",
            options: [
                { text: "0 (Stopp)", correct: true },
                { text: "Ein Wert nahe Null (durch Näherung).", correct: true },
                { text: "100 (Volle Fahrt vorwärts).", correct: false },
                { text: "-10 (Langsam rückwärts).", correct: false }
            ]
        },
        {
            q: "Welche Rolle spielen die Zufallswerte (z. B. -1 bis 1) beim Start?",
            diff: "**",
            options: [
                { text: "Sie dienen als initiale Startwerte für Gewichte und Bias.", correct: true },
                { text: "Sie verhindern einen Symmetriebruch (alle Gewichte gleich).", correct: true },
                { text: "Sie steuern das Zufallsprinzip während der Fahrt.", correct: false },
                { text: "Sie begrenzen die maximale Motorleistung.", correct: false }
            ]
        },
        {
            q: "Der Roboter fährt bei zu kleinem Abstand vorwärts statt rückwärts. Was ist die Ursache?",
            diff: "***",
            options: [
                { text: "Das Gewicht für den Ist-Abstand hat das falsche Vorzeichen.", correct: true },
                { text: "Das Netz hat eine falsche Korrelation gelernt.", correct: true },
                { text: "Die Lernrate war exakt auf 0.0003 eingestellt.", correct: false },
                { text: "Der Ultraschallsensor wurde an Port 4 angeschlossen.", correct: false }
            ]
        },
        {
            q: "Was ist ein Vorteil der Open Roberta Simulation (SIM)?",
            diff: "*",
            options: [
                { text: "Man benötigt keine physische Hardware.", correct: true },
                { text: "Kollisionen führen nicht zu Hardwareschäden.", correct: true },
                { text: "Die Simulation ist physikalisch exakter als die Realität.", correct: false },
                { text: "Der Roboter benötigt in der SIM keinen Akku.", correct: false }
            ]
        },
        {
            q: "Warum ist eine 'lineare' Aktivierungsfunktion für dieses Szenario sinnvoll?",
            diff: "***",
            options: [
                { text: "Der Zusammenhang zwischen Abstand und Tempo ist proportional.", correct: true },
                { text: "Sie ist mathematisch einfach für Regression geeignet.", correct: true },
                { text: "Nur sie erlaubt negative Ausgabewerte.", correct: false },
                { text: "Andere Funktionen funktionieren in Roberta nicht.", correct: false }
            ]
        },
        {
            q: "Welche Eingabewerte (Inputs) nutzt das Neuron in diesem spezifischen Projekt?",
            diff: "*",
            options: [
                { text: "Ist-Abstand (Sensorwert)", correct: true },
                { text: "Soll-Abstand (Vorgabe)", correct: true },
                { text: "Motorleistung des letzten Schritts", correct: false },
                { text: "Helligkeit des Umgebungslichts", correct: false }
            ]
        },
        {
            q: "Wie wird der Fehler 'e' in der Delta-Regel berechnet?",
            diff: "**",
            options: [
                { text: "e = Target (t) - tatsächliche Ausgabe (y)", correct: true },
                { text: "Differenz zwischen Wunsch und Wirklichkeit.", correct: true },
                { text: "e = Ist-Abstand - Soll-Abstand", correct: false },
                { text: "e = Lernrate * Gewicht", correct: false }
            ]
        },
        {
            q: "Was bewirkt der 'Bias' (b) in der Aktivierungsfunktion?",
            diff: "***",
            options: [
                { text: "Er verschiebt die Aktivierungsfunktion unabhängig von den Eingaben.", correct: true },
                { text: "Er ermöglicht eine Ausgabe ungleich Null, wenn alle Inputs Null sind.", correct: true },
                { text: "Er dient zur Filterung von Sensorrauschen.", correct: false },
                { text: "Er verdoppelt die Lernrate automatisch.", correct: false }
            ]
        },
        {
            q: "Was würde passieren, wenn die Lernrate (η) auf 0 gesetzt wird?",
            diff: "**",
            options: [
                { text: "Das Netz lernt überhaupt nicht.", correct: true },
                { text: "Die Gewichte bleiben dauerhaft auf ihren Startwerten.", correct: true },
                { text: "Das Netz lernt unendlich schnell.", correct: false },
                { text: "Der Roboter fährt mit Maximalgeschwindigkeit.", correct: false }
            ]
        },
        {
            q: "Wofür werden Aktivierungsfunktionen wie 'Sigmoid' oder 'Tanh' oft genutzt?",
            diff: "***",
            options: [
                { text: "Um die Ausgabe auf einen bestimmten Bereich (z.B. 0 bis 1) zu begrenzen.", correct: true },
                { text: "Um nicht-lineare Zusammenhänge abzubilden.", correct: true },
                { text: "Um die Rechenzeit des Roboters zu halbieren.", correct: false },
                { text: "Um den Ultraschallsensor zu ersetzen.", correct: false }
            ]
        }
    ];

    let currentIdx = 0;
    let score = 0;

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function initQuiz() {
        const container = document.getElementById('quiz-box');
        questions.forEach((qData, idx) => {
            const block = document.createElement('div');
            block.className = `question-block ${idx === 0 ? 'active' : ''}`;
            block.id = `q-${idx}`;
            
            // Shuffle options
            shuffle(qData.options);

            block.innerHTML = `
                <div class="difficulty">Schwierigkeit: ${qData.diff}</div>
                <h3>${idx + 1}. ${qData.q}</h3>
                <p><small>(Mehrere Antworten möglich)</small></p>
                <ul class="options-list">
                    ${qData.options.map((opt, oIdx) => `
                        <li class="option-item" onclick="toggleOption(this, ${idx}, ${oIdx})">
                            <span class="checkbox"></span>
                            <span>${opt.text}</span>
                        </li>
                    `).join('')}
                </ul>
            `;
            container.appendChild(block);
        });
        updateProgress();
    }

    function toggleOption(el, qIdx, oIdx) {
        el.classList.toggle('selected');
    }

    function nextQuestion() {
        const currentBlock = document.getElementById(`q-${currentIdx}`);
        currentBlock.classList.remove('active');
        
        currentIdx++;
        if (currentIdx < questions.length) {
            document.getElementById(`q-${currentIdx}`).classList.add('active');
            document.getElementById('question-counter').innerText = `Frage ${currentIdx + 1} von ${questions.length}`;
            if (currentIdx === questions.length - 1) {
                document.getElementById('next-btn').style.display = 'none';
                document.getElementById('submit-btn').style.display = 'block';
            }
        }
        updateProgress();
    }

    function updateProgress() {
        const percent = ((currentIdx) / questions.length) * 100;
        document.getElementById('progress').style.width = percent + '%';
    }

    function showResults() {
        score = 0;
        questions.forEach((qData, qIdx) => {
            const block = document.getElementById(`q-${qIdx}`);
            const items = block.querySelectorAll('.option-item');
            let qCorrect = true;

            items.forEach((item, oIdx) => {
                const isSelected = item.classList.contains('selected');
                const isCorrect = qData.options[oIdx].correct;
                if (isSelected !== isCorrect) qCorrect = false;
            });

            if (qCorrect) score++;
        });

        document.getElementById('quiz-box').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';
        document.getElementById('submit-btn').style.display = 'none';
        document.getElementById('question-counter').style.display = 'none';
        
        const resultArea = document.getElementById('result-area');
        resultArea.style.display = 'block';
        document.getElementById('score-display').innerText = `${score}/${questions.length}`;
        document.getElementById('progress').style.width = '100%';

        let feedback = "";
        if (score === 15) feedback = "Perfekt! Du bist ein KI-Experte. [cite: 1, 119]";
        else if (score >= 10) feedback = "Sehr gut! Du hast die Prinzipien der Delta-Regel und Neuronen verstanden. [cite: 125]";
        else feedback = "Guter Versuch! Schau dir die Formeln für Gewichte und Bias noch einmal genauer an. [cite: 111, 125]";
        document.getElementById('feedback-text').innerText = feedback;
    }

    initQuiz();
</script>

</body>
</html>
