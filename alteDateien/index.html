<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>informatik-nds.de</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1e1e1e; /* Dark Mode */
            color: #eee;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        main {
            padding: 2rem;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: -webkit-linear-gradient(45deg, #3b82f6, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            /* Fallback für Browser, die den Gradienten-Text nicht unterstützen */
            color: #3b82f6; 
        }
        p {
            font-size: 1.2rem;
            color: #cbd5e1;
            font-weight: 300;
        }
        footer {
            position: absolute;
            bottom: 20px;
            font-size: 0.9rem;
        }
        footer a {
            color: #64748b;
            text-decoration: none;
            transition: color 0.2s;
        }
        footer a:hover {
            color: #eee;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <main>
        <h1>informatik-nds.de</h1>
        <p>Hier entsteht (k)eine neue Internetpräsenz ;-)</p>
    </main>

    <footer>
        <a href="impressum.html">Impressum & Datenschutz</a>
    </footer>

</body>
</html>
