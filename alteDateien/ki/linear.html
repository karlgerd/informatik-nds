<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linear Classifier | informatik-nds</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    body {
      margin: 0; padding: 0;
      background-color: #1e1e1e; /* Dark Mode */
      color: #eee;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      height: 100vh; font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }
    canvas {
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border-radius: 8px;
    }
    .controls {
      margin-top: 15px; display: flex; gap: 20px;
      background: #2a2a2a; padding: 10px 20px;
      border-radius: 30px; align-items: center;
    }
    .control-group { display: flex; flex-direction: column; align-items: center; }
    label { font-size: 12px; margin-bottom: 5px; color: #aaa; }
    select { padding: 5px; border-radius: 4px; background: #444; color: #fff; border: none; }
    .info {
      position: absolute; top: 60px; left: 20px; /* Versetzt wegen Back Button */
      background: rgba(0, 0, 0, 0.7); padding: 15px;
      border-radius: 8px; pointer-events: none;
    }
    h1 { margin: 0 0 5px 0; font-size: 1.2rem; color: #fff; }
    p { margin: 0; font-size: 0.9rem; color: #ccc; }
    .key-hint { color: #4CAF50; font-weight: bold; }
    .status-active { color: #4CAF50; font-weight: bold; }
    .status-done { color: #2196F3; font-weight: bold; }
    .home-btn {
        position: fixed; top: 20px; left: 20px;
        background: rgba(255,255,255,0.1); color: white;
        text-decoration: none; padding: 8px 15px; border-radius: 5px;
        font-size: 14px; border: 1px solid rgba(255,255,255,0.2);
        transition: all 0.2s; z-index: 1000;
    }
    .home-btn:hover { background: rgba(255,255,255,0.2); }
  </style>
</head>
<body>

<a href="index.html" class="home-btn">⬅ Übersicht</a>

<div class="info">
  <h1>Linear Classifier</h1>
  <p>Status: <span id="status-text" class="status-active">Lerne...</span></p>
  <p id="acc-display">Genauigkeit: 0%</p>
  <p id="loss-display">Loss: 0.00</p>
  <br>
  <p><span class="key-hint">[R]</span> Neue Daten / Reset</p>
</div>

<div class="controls">
  <div class="control-group">
    <label>Daten-Form</label>
    <select id="selectMode">
      <option value="cluster">Cluster (Wolken)</option>
      <option value="layers">Schichten (Diagonal)</option>
    </select>
  </div>
  <div class="control-group">
    <label>Klassen</label>
    <input type="range" id="sliderClasses" min="2" max="4" value="3" step="1">
  </div>
  <div class="control-group">
    <label>Streuung</label>
    <input type="range" id="sliderSpread" min="0.5" max="3.0" value="1.0" step="0.1">
  </div>
  <div class="control-group">
    <label>Lernrate</label>
    <input type="range" id="sliderRate" min="0.001" max="0.2" value="0.05" step="0.001">
  </div>
</div>

<script>
// Code unverändert, nur hier eingefügt
let points=[],model,canvasSize=600,coordinateScale=20,bgLayer,numClasses=3,spread=1,trainingStepsPerFrame=20,trainingFrameCount=0,MAX_TRAINING_FRAMES=240,isTraining=!0,palette=[[65,105,225],[220,20,60],[46,139,87],[255,165,0]],sliderClasses,sliderSpread,sliderRate,selectMode,accDisplay,lossDisplay,statusText;
function setup(){createCanvas(canvasSize,canvasSize),bgLayer=createGraphics(canvasSize,canvasSize),sliderClasses=select("#sliderClasses"),sliderSpread=select("#sliderSpread"),sliderRate=select("#sliderRate"),selectMode=select("#selectMode"),accDisplay=select("#acc-display"),lossDisplay=select("#loss-display"),statusText=select("#status-text"),sliderClasses.input(resetSimulation),sliderSpread.input(resetSimulation),selectMode.changed(resetSimulation),sliderRate.input(()=>{trainingFrameCount=0,isTraining=!0}),resetSimulation()}
function draw(){background(30),isTraining?(model.train(points,parseFloat(sliderRate.value()),trainingStepsPerFrame),trainingFrameCount++,trainingFrameCount>=MAX_TRAINING_FRAMES&&(isTraining=!1,renderFinalBackground())):image(bgLayer,0,0),updateStatusUI(),drawSmartBoundaries(),drawPoints(),updateStats()}
function updateStatusUI(){isTraining?(statusText.html("Lerne..."),statusText.class("status-active")):(statusText.html("Fertig"),statusText.class("status-done"))}
function keyPressed(){("r"===key||"R"===key)&&resetSimulation()}
function resetSimulation(){numClasses=parseInt(sliderClasses.value()),spread=parseFloat(sliderSpread.value()),generateData(),model=new SoftmaxClassifier(3,numClasses),trainingFrameCount=0,isTraining=!0,bgLayer.clear()}
function renderFinalBackground(){bgLayer.noStroke();let e=4;for(let a=0;a<width;a+=e)for(let s=0;s<height;s+=e){let t=map(a+e/2,0,width,-1,1),r=map(s+e/2,0,height,1,-1),l=model.predict([t,r,1]),i=0,n=0,o=0;for(let e=0;e<numClasses;e++)i+=palette[e][0]*l[e],n+=palette[e][1]*l[e],o+=palette[e][2]*l[e];bgLayer.fill(i,n,o,100),bgLayer.rect(a,s,e,e)}}
function generateData(){points=[];"cluster"===selectMode.value()?generateClusters():generateLayers()}
function generateClusters(){let e=[];e=2===numClasses?[{x:5,y:5},{x:15,y:15}]:3===numClasses?[{x:10,y:16},{x:5,y:5},{x:15,y:5}]:[{x:5,y:15},{x:15,y:15},{x:5,y:5},{x:15,y:5}];for(let a=0;a<numClasses;a++)for(let s=0;s<40;s++)addPoint(randomGaussian(e[a].x,spread),randomGaussian(e[a].y,spread),a)}
function generateLayers(){for(let e=0;e<numClasses;e++){let a=map(e,0,numClasses-1,.25,.75)*coordinateScale,s=map(e,0,numClasses-1,.25,.75)*coordinateScale;for(let t=0;t<40;t++){let r=randomGaussian(0,8),l=randomGaussian(0,.7*spread),i=r*cos(-PI/4)-l*sin(-PI/4),n=r*sin(-PI/4)+l*cos(-PI/4);addPoint(a+i,s+n,e)}}}
function addPoint(e,a,s){e=constrain(e,-5,25),a=constrain(a,-5,25),points.push({x:e,y:a,label:s,nx:map(e,0,coordinateScale,-1,1),ny:map(a,0,coordinateScale,-1,1)})}
function drawSmartBoundaries(){stroke(255),strokeWeight(3),strokeCap(ROUND);let e=100;for(let a=0;a<numClasses;a++)for(let s=a+1;s<numClasses;s++){let t=model.weights[a][0]-model.weights[s][0],r=model.weights[a][1]-model.weights[s][1],l=model.weights[a][2]-model.weights[s][2],i=null,n=null;if(Math.abs(r)>Math.abs(t))for(let o=0;o<=e;o++){let c=map(o,0,e,-1,1),d=-(t*c+l)/r;processLinePoint(c,d,a,s,(e,a)=>{null!==i&&line(i,n,e,a),i=e,n=a},()=>{i=null})}else for(let o=0;o<=e;o++){let d=map(o,0,e,-1,1),c=-(r*d+l)/t;processLinePoint(c,d,a,s,(e,a)=>{null!==i&&line(i,n,e,a),i=e,n=a},()=>{i=null})}}}
function processLinePoint(e,a,s,t,r,l){if(e<-1.05||e>1.05||a<-1.05||a>1.05)return void l();let i=model.getRawScores([e,a,1])[s];for(let r=0;r<numClasses;r++)if(r!==s&&r!==t&&model.getRawScores([e,a,1])[r]>i+.01)return void l();r(map(e,-1,1,0,width),map(a,1,-1,0,height))}
function drawPoints(){strokeWeight(1),stroke(255);for(let e of points)fill(palette[e.label]),ellipse(map(e.nx,-1,1,0,width),map(e.ny,1,-1,0,height),12,12)}
function updateStats(){if(!isTraining&&frameCount%30!=0)return;let e=0,a=0;for(let s of points){let t=model.predict([s.nx,s.ny,1]),r=-1,l=-1;for(let e=0;e<numClasses;e++)t[e]>r&&(r=t[e],l=e);l===s.label&&e++,a+=-Math.log(Math.max(t[s.label],1e-10))}accDisplay.html(`Genauigkeit: ${((e/points.length)*100).toFixed(1)}%`),lossDisplay.html(`Loss: ${(a/points.length).toFixed(3)}`)}
class SoftmaxClassifier{constructor(e,a){this.weights=[];for(let s=0;s<a;s++){let t=[];for(let r=0;r<e;r++)t.push(random(-.5,.5));t[e-1]=0,this.weights.push(t)}}getRawScores(e){let a=[];for(let s=0;s<this.weights.length;s++){let t=0;for(let a=0;a<e.length;a++)t+=this.weights[s][a]*e[a];a.push(t)}return a}predict(e){let a=this.getRawScores(e),s=Math.max(...a),t=a.map(e=>Math.exp(e-s)),r=t.reduce((e,a)=>e+a,0);return t.map(e=>e/r)}train(e,a,s){for(let t=0;t<s;t++){let r=random(e),l=[r.nx,r.ny,1],i=this.predict(l);for(let e=0;e<this.weights.length;e++){let s=i[e]-(e===r.label?1:0);for(let t=0;t<l.length;t++)this.weights[e][t]-=a*s*l[t]}}}}
</script>
</body>
</html>
