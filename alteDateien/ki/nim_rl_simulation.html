<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nim-RL Simulation</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --panel-border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            
            --player-a: #3b82f6;
            --player-b: #a855f7;
            
            --dice-4: #ef4444;   /* Red - Worst */
            --dice-6: #f97316;   /* Orange */
            --dice-12: #eab308;  /* Yellow - Neutral */
            --dice-20: #84cc16;  /* Light Green */
            --dice-100: #22c55e; /* Green - Best */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        header {
            text-align: center;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, var(--player-a), var(--player-b));
            -webkit-background-clip: text;
            color: transparent;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Spielfeld */
        .board-container {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: row;
            align-items: center;
        }

        .board-label {
            font-weight: 600;
            margin-right: 1rem;
            font-size: 1.1rem;
            white-space: nowrap;
        }

        .board {
            flex: 1;
            display: flex;
            gap: 4px;
            justify-content: space-between;
            position: relative;
        }

        .field {
            flex: 1;
            min-height: 52px;
            background: var(--bg-color);
            border: 2px solid var(--panel-border);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.3s ease;
            min-width: 0; 
            padding: 0 4px;
        }

        .field.start { border-color: var(--text-muted); }
        .field.goal { border-color: var(--dice-100); background-color: rgba(34, 197, 94, 0.1); }

        .field.visited-a { background-color: rgba(59, 130, 246, 0.25); border-color: var(--player-a); }
        .field.visited-b { background-color: rgba(168, 85, 247, 0.25); border-color: var(--player-b); }

        .field-text {
            font-size: 0.8rem;
            font-weight: bold;
            z-index: 1;
            text-align: center;
            word-wrap: break-word;
        }

        .player-token {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            position: absolute;
            transition: all 0.3s ease;
            box-shadow: 0 0 4px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6rem;
            color: white;
            font-weight: bold;
            opacity: 0;
            transform: scale(0);
            z-index: 2;
        }

        .player-token.active {
            opacity: 1;
            transform: scale(1);
        }

        /* Marker A nach oben rechts, B nach unten rechts */
        .token-a { background-color: var(--player-a); top: -4px; right: -4px; }
        .token-b { background-color: var(--player-b); bottom: -4px; right: -4px; }

        /* Controls */
        .controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            background-color: var(--panel-bg);
            color: var(--text-main);
            border: 1px solid var(--panel-border);
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover:not(:disabled) {
            background-color: var(--panel-border);
            transform: translateY(-1px);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        button.primary { background-color: var(--player-a); border-color: var(--player-a); }
        button.primary:hover:not(:disabled) { background-color: #2563eb; }
        
        button.danger { background-color: transparent; border-color: var(--dice-4); color: var(--dice-4); }
        button.danger:hover:not(:disabled) { background-color: rgba(239, 68, 68, 0.1); }

        /* Status & Stats */
        .stats-wrapper {
            display: flex;
            align-items: stretch;
            gap: 1rem;
        }

        .stats-wrapper .stats-panel {
            flex: 1;
        }

        .stats-wrapper button.danger {
            white-space: nowrap;
        }

        .stats-panel {
            display: flex;
            justify-content: space-around;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 1rem;
            font-size: 1.1rem;
        }

        .stat-a { color: var(--player-a); font-weight: bold; }
        .stat-b { color: var(--player-b); font-weight: bold; }

        /* Tabellen */
        .tables-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        @media (max-width: 900px) {
            .tables-wrapper { grid-template-columns: 1fr; }
        }

        .table-container {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 1rem;
            overflow-x: auto;
        }

        .table-container h2 {
            font-size: 1.1rem;
            margin-bottom: 0.75rem;
            text-align: center;
        }
        .table-container.sys-a h2 { color: var(--player-a); }
        .table-container.sys-b h2 { color: var(--player-b); }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            table-layout: fixed;
            min-width: 400px;
        }

        th, td {
            padding: 0.4rem 0.2rem;
            border: 1px solid var(--panel-border);
            font-size: 0.85rem;
        }

        th {
            background-color: rgba(0,0,0,0.2);
            color: var(--text-muted);
            font-weight: 600;
        }

        td.field-col {
            font-weight: bold;
            background-color: rgba(0,0,0,0.1);
            font-size: 0.75rem;
        }

        .dice-cell {
            font-weight: bold;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
            margin: 1px;
            font-size: 0.75rem;
            transition: all 0.2s ease;
        }
        
        .dice-cell.empty { background: transparent; box-shadow: none; color: var(--panel-border); text-shadow: none; }

        /* Dice Colors */
        .d-4 { background-color: var(--dice-4); color: white; }
        .d-6 { background-color: var(--dice-6); color: white; }
        .d-12 { background-color: var(--dice-12); color: black; text-shadow: none; }
        .d-20 { background-color: var(--dice-20); color: black; text-shadow: none;}
        .d-100 { background-color: var(--dice-100); color: white; }

        /* Log */
        .log-container {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 1.5rem;
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.9rem;
        }

        .log-entry {
            margin-bottom: 0.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--panel-border);
        }
        .log-entry:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        
        .log-a { color: var(--player-a); }
        .log-b { color: var(--player-b); }
        .log-neutral { color: var(--text-muted); }

        /* Verbesserte Markierung der im aktuellen Spiel gemachten Züge in der Matrix */
        .cell-chosen {
            outline: 2px solid white;
            outline-offset: -2px;
            box-shadow: inset 0 0 12px rgba(255, 255, 255, 0.4);
            color: #ffffff !important;
            text-shadow: 0 1px 3px #000000, 0 1px 5px #000000 !important;
            z-index: 10;
            position: relative;
        }

        /* Animation Enhancements */
        @keyframes flashUp {
            0% { background-color: var(--dice-100); color: white; transform: scale(1.1); }
            100% { background-color: inherit; color: inherit; transform: scale(1); }
        }
        
        @keyframes flashDown {
            0% { background-color: var(--dice-4); color: white; transform: scale(1.1); }
            100% { background-color: inherit; color: inherit; transform: scale(1); }
        }

        .flash-up {
            animation: flashUp 1.2s ease-out;
            z-index: 5;
            position: relative;
        }

        .flash-down {
            animation: flashDown 1.2s ease-out;
            z-index: 5;
            position: relative;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Nim-RL Simulation</h1>
        <p class="subtitle">Zwei Systeme lernen durch Reinforcement Learning (Self-Play) den optimalen Weg.</p>
    </header>

    <div class="stats-wrapper">
        <div class="stats-panel">
            <div>Spiele gesamt: <span id="total-games">0</span></div>
            <div class="stat-a">System A Siege: <span id="wins-a">0</span></div>
            <div class="stat-b">System B Siege: <span id="wins-b">0</span></div>
        </div>
        <button class="danger" id="btn-reset" onclick="resetAll()">Reset</button>
    </div>

    <div class="board-container">
        <div class="board-label">Feld:</div>
        <div class="board" id="game-board">
            <!-- Fields generated by JS -->
        </div>
    </div>

    <div class="controls">
        <button class="primary" id="btn-main-action" onclick="handleMainAction()">Spiel starten (Einzelschritt-Modus)</button>
        <button id="btn-undo" onclick="undoStep()" disabled>Schritt zurück</button>
        <button id="btn-auto-play" onclick="startAutoPlay()">Einzelspiel (automatisch)</button>
        <button id="btn-play-10" onclick="playGames(10)">10 Spiele trainieren</button>
        <button id="btn-play-100" onclick="playGames(100)">100 Spiele trainieren</button>
    </div>

    <div class="tables-wrapper">
        <div class="table-container sys-a">
            <h2>Gehirn: System A</h2>
            <table id="table-brain-a">
                <!-- Generated by JS -->
            </table>
        </div>
        <div class="table-container sys-b">
            <h2>Gehirn: System B</h2>
            <table id="table-brain-b">
                <!-- Generated by JS -->
            </table>
        </div>
    </div>

    <div class="log-container" id="log-output">
        <div class="log-neutral">System bereit. Initialisierung abgeschlossen.</div>
    </div>
</div>

<script>
    // --- Konstanten & Konfiguration ---
    const DICE_TIERS = [4, 6, 12, 20, 100];
    const TOTAL_FIELDS = 10;
    const TARGET_FIELD = TOTAL_FIELDS - 1; // Ziel ist Feld 9

    // --- State ---
    let brainA = [];
    let brainB = [];
    let stats = { games: 0, winsA: 0, winsB: 0 };
    let nextStartPlayer = 'A';
    
    // State für den Schritt-für-Schritt-Modus
    let stepState = {
        active: false,
        pos: 0,
        currPlayer: 'A',
        startPlayer: 'A',
        historyA: [],
        historyB: [],
        phase: 'idle', // 'idle', 'playing', 'learning'
        winner: null,
        timeline: [],
        timelineIndex: 0,
        winLogElem: null,
        autoPlaying: false
    };

    // --- Initialisierung ---
    function initBrains() {
        brainA = createBrain();
        brainB = createBrain();
    }

    function createBrain() {
        let brain = [];
        for (let i = 0; i < TARGET_FIELD; i++) {
            let moves = {};
            if (i <= TARGET_FIELD - 3) {
                moves[1] = 12; moves[2] = 12; moves[3] = 12;
            } else if (i === TARGET_FIELD - 2) {
                moves[1] = 12; moves[2] = 12;
            } else if (i === TARGET_FIELD - 1) {
                moves[1] = 12; // Auch für Feld 8 wird der Wert trainiert!
            }
            brain.push(moves);
        }
        return brain;
    }

    function resetAll() {
        initBrains();
        stats = { games: 0, winsA: 0, winsB: 0 };
        nextStartPlayer = 'A';
        
        stepState.active = false;
        stepState.phase = 'idle';
        stepState.timeline = [];
        stepState.timelineIndex = 0;
        stepState.autoPlaying = false;
        
        updateMainButton();
        updateUndoButton();
        setButtonsState(true);
        document.getElementById('btn-auto-play').disabled = false;
        document.getElementById('btn-main-action').disabled = false;

        let startFieldText = document.querySelector('#field-0 .field-text');
        if (startFieldText) {
            startFieldText.innerHTML = `Start`;
        }

        updateUI();
        clearLog();
        log("System wurde zurückgesetzt.", "neutral");
        resetBoardColors();
        renderBoard(0, null); 
    }

    function resetBoardColors() {
        for (let i = 0; i < TOTAL_FIELDS; i++) {
            let f = document.getElementById(`field-${i}`);
            if (f) {
                f.classList.remove('visited-a', 'visited-b');
            }
        }
        document.querySelectorAll('.cell-chosen').forEach(el => el.classList.remove('cell-chosen'));
    }

    // --- Logik: Würfeln & Ziehen ---
    function rollDie(sides) {
        return Math.floor(Math.random() * sides) + 1;
    }

    function chooseMove(brain, pos, player) {
        let posText = pos === 0 ? "Start" : pos;
        let movesDict = brain[pos];
        let validMoves = Object.keys(movesDict).map(Number);
        
        let cumulativeScores = {};
        let rollStrings = {};
        validMoves.forEach(m => {
            cumulativeScores[m] = 0;
            rollStrings[m] = "";
        });
        
        let candidates = [...validMoves];
        let finalMove;

        // Wir würfeln in jedem Fall aus, auch wenn es nur 1 Option gibt (z.B. Feld 8),
        // damit die Log-Ausgabe konsistent aufgebaut wird.
        if (validMoves.length === 1) {
            finalMove = validMoves[0];
            let r = rollDie(movesDict[finalMove]);
            rollStrings[finalMove] = r.toString();
        } else {
            // Schleife für Addition bei Gleichstand
            while (true) {
                candidates.forEach(m => {
                    let r = rollDie(movesDict[m]);
                    cumulativeScores[m] += r;
                    rollStrings[m] += (rollStrings[m] ? "+" : "") + r;
                });

                let maxScore = Math.max(...candidates.map(m => cumulativeScores[m]));
                let winners = candidates.filter(m => cumulativeScores[m] === maxScore);

                if (winners.length === 1) {
                    finalMove = winners[0];
                    break;
                } else {
                    candidates = winners; // Bei Gleichstand wiederholen mit den Siegern
                }
            }
        }

        let logParts = validMoves.map(m => `Würfel ${m}: ${rollStrings[m]}`);
        let stepText = finalMove === 1 ? "Schritt" : "Schritte";
        let finalLog = `System ${player} - Feld ${posText}: ${logParts.join(' / ')} -> ${finalMove} ${stepText}`;
        
        return { move: finalMove, logMsg: finalLog };
    }

    function updateBrain(brain, history, isWinner) {
        for (let record of history) {
            let p = record.pos;
            let m = record.move;
            
            let currentDie = brain[p][m];
            let tierIdx = DICE_TIERS.indexOf(currentDie);
            
            if (isWinner && tierIdx < DICE_TIERS.length - 1) {
                brain[p][m] = DICE_TIERS[tierIdx + 1];
            } else if (!isWinner && tierIdx > 0) {
                brain[p][m] = DICE_TIERS[tierIdx - 1];
            }
        }
    }

    function getChangedCells(brain, history, isWinner) {
        let changes = [];
        for (let record of history) {
            let p = record.pos;
            let m = record.move;
            
            let currentDie = brain[p][m];
            let tierIdx = DICE_TIERS.indexOf(currentDie);
            
            if (isWinner && tierIdx < DICE_TIERS.length - 1) {
                changes.push({ pos: p, move: m });
            } else if (!isWinner && tierIdx > 0) {
                changes.push({ pos: p, move: m });
            }
        }
        return changes;
    }

    // --- Schritt-für-Schritt Modus ---
    function updateMainButton() {
        let btn = document.getElementById('btn-main-action');
        if (stepState.phase === 'idle') {
            btn.innerText = "Spiel starten (Einzelschritt-Modus)";
        } else if (stepState.phase === 'playing') {
            btn.innerText = "Spielzug ausführen";
        } else if (stepState.phase === 'learning') {
            btn.innerText = "Bewertungen anpassen";
        }
    }

    function updateUndoButton() {
        let btn = document.getElementById('btn-undo');
        if (btn) {
            btn.disabled = (stepState.phase === 'idle' || stepState.timelineIndex === 0 || stepState.autoPlaying);
        }
    }

    function handleMainAction() {
        let btn = document.getElementById('btn-main-action');
        btn.disabled = true; // Doppelklick-Schutz

        if (stepState.phase === 'idle') {
            startStepGame();
            btn.disabled = false; 
        } else if (stepState.phase === 'playing') {
            nextStep().then(() => { btn.disabled = false; });
        } else if (stepState.phase === 'learning') {
            executeLearning().then(() => { btn.disabled = false; });
        }
    }

    function startStepGame() {
        resetBoardColors();
        
        stepState = {
            active: true,
            pos: 0,
            currPlayer: nextStartPlayer,
            startPlayer: nextStartPlayer,
            historyA: [],
            historyB: [],
            phase: 'playing',
            winner: null,
            timeline: [],
            timelineIndex: 0,
            winLogElem: null,
            autoPlaying: false
        };
        
        let startFieldText = document.querySelector('#field-0 .field-text');
        if (startFieldText) {
            startFieldText.innerHTML = `Start<br><span style="color: var(--player-${nextStartPlayer.toLowerCase()}); font-size: 0.75em;">Startspieler: ${nextStartPlayer}</span>`;
        }

        renderBoard(0, stepState.currPlayer);
        log(`--- Neues Spiel startet ---`, 'neutral');
        
        setButtonsState(false);
        updateMainButton();
        updateUndoButton();
    }

    async function nextStep() {
        let pos = stepState.pos;
        let currPlayer = stepState.currPlayer;
        let brain = currPlayer === 'A' ? brainA : brainB;

        let moveInfo, move, logMsg, action;

        // Deterministisches Replay: Falls wir Schritte rückgängig gemacht haben, spiele sie neu ab
        if (stepState.timelineIndex < stepState.timeline.length) {
            action = stepState.timeline[stepState.timelineIndex];
            move = action.move;
            logMsg = action.logMsg;
            action.logElem = log(logMsg, currPlayer.toLowerCase(), true);
        } else {
            // Neuer Wurf, falls wir am Ende der Zeitleiste sind
            moveInfo = chooseMove(brain, pos, currPlayer);
            move = moveInfo.move;
            logMsg = moveInfo.logMsg;
            action = { player: currPlayer, fromPos: pos, move: move, logMsg: logMsg, cellId: `cell-${currPlayer.toLowerCase()}-${pos}-${move}`, logElem: null };
            stepState.timeline.push(action);
            action.logElem = log(logMsg, currPlayer.toLowerCase(), true);
        }

        if (currPlayer === 'A') {
            stepState.historyA.push({ pos, move });
        } else {
            stepState.historyB.push({ pos, move });
        }
        
        // Matrix Highlight
        if (pos < TARGET_FIELD) {
            let cell = document.getElementById(action.cellId);
            if (cell) cell.classList.add('cell-chosen');
        }

        stepState.timelineIndex++;

        // Animation auf dem Feld
        for (let step = 1; step <= move; step++) {
            pos++;
            renderBoard(pos, currPlayer);
            await sleep(stepState.autoPlaying ? 100 : 250); // Schneller, wenn automatisch
        }

        // Feld färben, auf dem die Figur abgesetzt wurde
        let landedField = document.getElementById(`field-${pos}`);
        if (landedField) {
            landedField.classList.add(`visited-${currPlayer.toLowerCase()}`);
        }
        
        stepState.pos = pos;
        stepState.currPlayer = currPlayer === 'A' ? 'B' : 'A';
        
        if (pos < TARGET_FIELD) {
            renderBoard(pos, stepState.currPlayer);
        } else {
            let winner = currPlayer; 
            stepState.winner = winner;
            renderBoard(TARGET_FIELD, winner);
            stepState.winLogElem = log(`System ${winner} hat das Ziel erreicht!`, 'neutral', true);
            
            stepState.phase = 'learning';
            updateMainButton();
        }
        updateUndoButton();
    }

    function undoStep() {
        if (stepState.phase === 'idle' || stepState.timelineIndex === 0 || stepState.autoPlaying) return;
        
        // Phase zurücksetzen, falls wir schon im End-Screen waren
        if (stepState.phase === 'learning') {
            stepState.phase = 'playing';
            if (stepState.winLogElem) {
                stepState.winLogElem.remove();
                stepState.winLogElem = null;
            }
            stepState.winner = null;
            updateMainButton();
        }
        
        stepState.timelineIndex--;
        let action = stepState.timeline[stepState.timelineIndex];
        
        // Log-Eintrag entfernen
        if (action.logElem) {
            action.logElem.remove();
            action.logElem = null;
        }
        
        // Historie bereinigen
        if (action.player === 'A') stepState.historyA.pop();
        else stepState.historyB.pop();
        
        // Spielerposition und Turn zurücksetzen
        stepState.pos = action.fromPos;
        stepState.currPlayer = action.player;
        
        recalculateBoardColors();
        renderBoard(stepState.pos, stepState.currPlayer);
        updateUndoButton();
    }

    function recalculateBoardColors() {
        // Kompletten Board-State visuell bereinigen
        for (let i = 0; i < TOTAL_FIELDS; i++) {
            let f = document.getElementById(`field-${i}`);
            if (f) f.classList.remove('visited-a', 'visited-b');
        }
        document.querySelectorAll('.cell-chosen').forEach(el => el.classList.remove('cell-chosen'));

        // Und anhand der aktuellen Zeitleiste wieder aufbauen
        for (let i = 0; i < stepState.timelineIndex; i++) {
            let a = stepState.timeline[i];
            let landed = a.fromPos + a.move;
            let cell = document.getElementById(a.cellId);
            if (cell) cell.classList.add('cell-chosen');
            let f = document.getElementById(`field-${landed}`);
            if (f) f.classList.add(`visited-${a.player.toLowerCase()}`);
        }
    }

    async function startAutoPlay() {
        if (stepState.phase === 'idle') {
            startStepGame();
        }
        stepState.autoPlaying = true;
        setButtonsState(false);
        document.getElementById('btn-main-action').disabled = true;
        document.getElementById('btn-undo').disabled = true;
        document.getElementById('btn-auto-play').disabled = true;
        
        while (stepState.autoPlaying && stepState.phase !== 'idle') {
            if (stepState.phase === 'playing') {
                await nextStep();
            } else if (stepState.phase === 'learning') {
                await executeLearning();
            }
            await sleep(800);
        }
        
        stepState.autoPlaying = false;
        setButtonsState(true);
        document.getElementById('btn-main-action').disabled = false;
        document.getElementById('btn-auto-play').disabled = false;
        updateUndoButton();
    }

    async function executeLearning() {
        let winner = stepState.winner;
        let loser = winner === 'A' ? 'B' : 'A';
        
        // Identifiziere welche Felder im Training auf/absteigen
        let changesWinner = getChangedCells(winner === 'A' ? brainA : brainB, winner === 'A' ? stepState.historyA : stepState.historyB, true);
        let changesLoser = getChangedCells(winner === 'A' ? brainB : brainA, winner === 'A' ? stepState.historyB : stepState.historyA, false);
        
        changesWinner.forEach(c => {
            let cell = document.getElementById(`cell-${winner.toLowerCase()}-${c.pos}-${c.move}`);
            if(cell) cell.classList.add('flash-up');
        });
        
        changesLoser.forEach(c => {
            let cell = document.getElementById(`cell-${loser.toLowerCase()}-${c.pos}-${c.move}`);
            if(cell) cell.classList.add('flash-down');
        });

        if (changesWinner.length > 0 || changesLoser.length > 0) {
            await sleep(1200); 
        }
        
        changesWinner.forEach(c => {
            let cell = document.getElementById(`cell-${winner.toLowerCase()}-${c.pos}-${c.move}`);
            if(cell) cell.classList.remove('flash-up');
        });
        changesLoser.forEach(c => {
            let cell = document.getElementById(`cell-${loser.toLowerCase()}-${c.pos}-${c.move}`);
            if(cell) cell.classList.remove('flash-down');
        });
        
        finishGame(stepState.startPlayer, winner, stepState.historyA, stepState.historyB);
        updateUI();
        
        stepState.active = false;
        stepState.phase = 'idle';
        stepState.timeline = [];
        stepState.timelineIndex = 0;
        
        let startFieldText = document.querySelector('#field-0 .field-text');
        if (startFieldText) {
            startFieldText.innerHTML = `Start`;
        }

        setButtonsState(true);
        updateMainButton();
        updateUndoButton();
        renderBoard(0, null); 
    }

    function finishGame(startPlayer, winner, historyA, historyB) {
        stats.games++;
        if (winner === 'A') stats.winsA++;
        else stats.winsB++;

        updateBrain(brainA, historyA, winner === 'A');
        updateBrain(brainB, historyB, winner === 'B');

        let loser = winner === 'A' ? 'B' : 'A';
        log(`Spiel ${stats.games} beendet. <span class="log-${winner.toLowerCase()}">Gewinner: ${winner}</span>. Belohnungen/Bestrafungen angewendet.`);

        nextStartPlayer = nextStartPlayer === 'A' ? 'B' : 'A';
    }

    // --- Massen-Training (ohne Animation) ---
    function playSingleFastGame() {
        let currPlayer = nextStartPlayer;
        let pos = 0;
        let historyA = [];
        let historyB = [];

        while (pos < TARGET_FIELD) {
            let brain = currPlayer === 'A' ? brainA : brainB;
            let moveInfo = chooseMove(brain, pos, currPlayer);
            
            if (currPlayer === 'A') {
                historyA.push({ pos, move: moveInfo.move });
            } else {
                historyB.push({ pos, move: moveInfo.move });
            }
            
            pos += moveInfo.move;
            currPlayer = currPlayer === 'A' ? 'B' : 'A';
        }
        
        let winner = currPlayer === 'A' ? 'B' : 'A'; 
        
        stats.games++;
        if (winner === 'A') stats.winsA++;
        else stats.winsB++;

        updateBrain(brainA, historyA, winner === 'A');
        updateBrain(brainB, historyB, winner === 'B');

        nextStartPlayer = nextStartPlayer === 'A' ? 'B' : 'A';
    }

    function playGames(count) {
        for(let i = 0; i < count; i++) {
            playSingleFastGame();
        }
        updateUI();
        log(`--- ${count} Spiele sofort simuliert ---`, 'neutral');
    }

    // --- UI Update & Rendering ---
    function updateUI() {
        document.getElementById('total-games').innerText = stats.games;
        document.getElementById('wins-a').innerText = stats.winsA;
        document.getElementById('wins-b').innerText = stats.winsB;
        
        renderBrainTable('table-brain-a', brainA, 'a');
        renderBrainTable('table-brain-b', brainB, 'b');
    }

    function renderBrainTable(tableId, brain, playerId) {
        const table = document.getElementById(tableId);
        
        // Tabellenkopf: Felder als Spalten
        let html = `
            <thead>
                <tr>
                    <th style="width: 20%;">Schritte \\ Feld</th>
        `;
        for (let i = 0; i < TARGET_FIELD; i++) {
            let fieldLabel = i === 0 ? 'Start' : i;
            html += `<th>${fieldLabel}</th>`;
        }
        html += `
                </tr>
            </thead>
            <tbody>
        `;

        // Zeilen: 1, 2, 3 Schritte
        for (let move = 1; move <= 3; move++) {
            let stepText = move === 1 ? "1" : `${move}`;
            html += `<tr><td class="field-col">${stepText}</td>`;
            
            for (let i = 0; i < TARGET_FIELD; i++) {
                if (brain[i] && brain[i][move]) {
                    let diceVal = brain[i][move];
                    html += `<td class="dice-cell d-${diceVal}" id="cell-${playerId}-${i}-${move}">W${diceVal}</td>`;
                } else {
                    html += `<td class="dice-cell empty">-</td>`;
                }
            }
            html += `</tr>`;
        }

        html += `</tbody>`;
        table.innerHTML = html;
    }

    function buildBoardUI() {
        const board = document.getElementById('game-board');
        let html = '';
        for (let i = 0; i < TOTAL_FIELDS; i++) {
            let extraClass = i === 0 ? 'start' : (i === TARGET_FIELD ? 'goal' : '');
            let label = i === 0 ? 'Start' : (i === TARGET_FIELD ? 'Ziel' : i);
            html += `
                <div class="field ${extraClass}" id="field-${i}">
                    <div class="field-text">${label}</div>
                    <div class="player-token token-a" id="token-a-${i}">A</div>
                    <div class="player-token token-b" id="token-b-${i}">B</div>
                </div>
            `;
        }
        board.innerHTML = html;
    }

    function renderBoard(pos, activePlayer) {
        document.querySelectorAll('.player-token').forEach(el => el.classList.remove('active'));
        
        if (activePlayer && pos !== null) {
            let token = document.getElementById(`token-${activePlayer.toLowerCase()}-${pos}`);
            if (token) token.classList.add('active');
        } else if (pos !== null) {
             let tokenA = document.getElementById(`token-a-${pos}`);
             let tokenB = document.getElementById(`token-b-${pos}`);
             if (tokenA) tokenA.classList.add('active');
             if (tokenB) tokenB.classList.add('active');
        }
    }

    function log(msg, type = 'neutral', returnElem = false) {
        const logOut = document.getElementById('log-output');
        const entry = document.createElement('div');
        entry.className = `log-entry log-${type}`;
        entry.innerHTML = msg;
        logOut.prepend(entry);
        logOut.scrollTop = 0;
        if (returnElem) return entry;
    }

    function clearLog() {
        document.getElementById('log-output').innerHTML = '';
    }

    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    function setButtonsState(enabled) {
        document.getElementById('btn-play-10').disabled = !enabled;
        document.getElementById('btn-play-100').disabled = !enabled;
        document.getElementById('btn-reset').disabled = !enabled;
    }

    // Init App
    initBrains();
    buildBoardUI();
    updateUI();
    updateMainButton();
    updateUndoButton();
    renderBoard(0, null);
</script>
</body>
</html>
